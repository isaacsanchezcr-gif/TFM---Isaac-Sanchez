# Revisa cada día si el OIJ publicó datos nuevos y, si los hay, actualiza el
# pronóstico y las alertas que muestra la aplicación.
name: Actualizar pronóstico

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días a las 6:17 (hora de Costa Rica)
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar datos del OIJ ya descargados
        uses: actions/cache@v4
        with:
          path: data/raw
          key: oij-${{ hashFiles('data/external/manifest_oij.json') }}
          restore-keys: oij-

      - name: Buscar datos nuevos en el portal del OIJ
        id: descarga
        run: python scripts/descargar_oij.py --salida-github "$GITHUB_OUTPUT"

      - name: Reentrenar y pronosticar
        if: steps.descarga.outputs.cambios == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/actualizar.py

      - name: Guardar resultados
        if: steps.descarga.outputs.cambios == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/datos models/lgbm_produccion.txt data/external/manifest_oij.json
          git diff --cached --quiet || git commit -m "Actualización automática del pronóstico"
          git push
